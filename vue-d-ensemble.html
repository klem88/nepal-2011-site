<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Népal 2011 · Carnet de route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --papier:#f3ede1; --papier-2:#e9e1d0; --carte-fond:#fbf8f2; --encre:#29251f; --encre-2:#6d6457; --trait:#d5c9b1;
  --everest:#c2410c; --dhaulagiri:#1d4ed8; --annapurna:#047857; --moto:#7c3aed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papier:#1c1a16; --papier-2:#25221d; --carte-fond:#221f1a; --encre:#ede6d8; --encre-2:#a69d8e; --trait:#3b362e;
    --everest:#fb923c; --dhaulagiri:#60a5fa; --annapurna:#34d399; --moto:#a78bfa;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papier);color:var(--encre);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:380px 1fr;height:100vh}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--trait)}
.entete{padding:22px 24px 14px}
.entete .sur{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--encre-2);margin:0}
.entete h1{font:600 30px/1.1 Fraunces,Georgia,serif;margin:4px 0 6px}
.entete p{margin:0;color:var(--encre-2);font-size:14px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--trait);border-block:1px solid var(--trait)}
.chiffres div{background:var(--papier);padding:10px 12px}
.chiffres b{display:block;font:600 20px Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.chiffres span{font-size:12px;color:var(--encre-2)}
.episodes{display:flex;flex-direction:column;gap:2px;padding:10px 12px 4px}
.episode{display:flex;gap:10px;align-items:flex-start;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:inherit;font:inherit}
.episode:hover{background:var(--papier-2)}
.episode[aria-pressed="true"]{background:var(--carte-fond);box-shadow:0 0 0 1px var(--trait)}
.episode i{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none}
.episode b{font-weight:600}
.episode small{display:block;color:var(--encre-2);font-size:12.5px}
.jours{flex:1;overflow:auto;padding:4px 12px 20px;border-top:1px solid var(--trait)}
.jours h2{font:600 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--encre-2);margin:14px 10px 6px}
.jour{display:grid;grid-template-columns:44px 1fr auto;gap:4px 10px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;color:inherit;font:inherit}
.jour:hover{background:var(--papier-2)}
.jour[aria-current="true"]{background:var(--carte-fond);box-shadow:inset 3px 0 var(--c)}
.jour .n{font:600 13px Fraunces,Georgia,serif;color:var(--c)}
.jour .t{font-size:14px}
.jour .d{font-size:12px;color:var(--encre-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.jour .t small{display:block;color:var(--encre-2);font-size:12px}
main{position:relative;min-height:0;display:grid;grid-template-rows:1fr auto}
.zone-carte{position:relative;min-height:0}
#carte{position:absolute;inset:0;background:var(--papier-2)}
.profil{background:var(--carte-fond);border-top:1px solid var(--trait);padding:10px 16px 6px;position:relative}
.profil header{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--encre-2)}
.profil header b{color:var(--encre);font-weight:600}
.profil svg{display:block;width:100%;height:140px;cursor:crosshair}
.profil .infobulle{position:absolute;pointer-events:none;background:var(--encre);color:var(--papier);font-size:12px;padding:3px 8px;border-radius:4px;transform:translate(-50%,-100%);white-space:nowrap;display:none}
.leaflet-container{font:inherit;background:var(--papier-2)}
.leaflet-popup-content{margin:10px 14px;font-size:13.5px;line-height:1.45}
.leaflet-popup-content b{font:600 15px Fraunces,Georgia,serif}
.etiquette{background:none;border:0;box-shadow:none;font:600 11.5px system-ui,sans-serif;color:#29251f;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.etiquette::before{display:none}
.fonds{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:4px}
.fonds button{border:1px solid var(--trait);background:var(--carte-fond);color:var(--encre);padding:4px 10px;border-radius:6px;font-size:12.5px;cursor:pointer}
.fonds button[aria-pressed="true"]{background:var(--encre);color:var(--papier)}
.legende{position:absolute;left:10px;bottom:10px;z-index:500;background:var(--carte-fond);border:1px solid var(--trait);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--encre-2);display:flex;gap:12px;align-items:center}
.legende svg{vertical-align:middle}
@media (max-width: 860px){
  .app{display:flex;flex-direction:column;height:auto}
  aside{display:contents}
  .entete{order:1}.chiffres{order:2}.episodes{order:3}
  main{order:4;height:80vh;flex:none}
  .jours{order:5;border-top:1px solid var(--trait);overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="entete">
      <p class="sur">Clément &amp; Romain · automne 2011</p>
      <h1>Népal, carnet de route</h1>
      <p>Deux mois à pied et à moto, de l'Everest au Dhaulagiri.</p>
    </div>
    <div class="chiffres" id="chiffres"></div>
    <div class="episodes" id="episodes"></div>
    <div class="jours" id="jours"></div>
  </aside>
  <main>
    <div class="zone-carte">
    <div id="carte"></div>
    <div class="fonds" role="group" aria-label="Fond de carte">
      <button data-fond="topo" aria-pressed="true">Relief</button>
      <button data-fond="sat">Satellite</button>
    </div>
    <div class="legende">
      <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="currentColor" stroke-width="3"/></svg> sentier</span>
      <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4"/></svg> avion, bus</span>
      <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="currentColor" stroke-width="3" stroke-dasharray="7 5"/></svg> tracé approximatif</span>
    </div>
    </div>
    <div class="profil">
      <header><span id="profil-titre"></span><span id="profil-info"></span></header>
      <svg id="profil" viewBox="0 0 1000 140" preserveAspectRatio="none" role="img" aria-label="Profil d'altitude"></svg>
      <div class="infobulle" id="infobulle"></div>
    </div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="donnees.js"></script>
<script>
const V = window.VOYAGE;
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
const couleur = id => css(id);
const fmt = n => Math.round(n).toLocaleString("fr-FR");

/* ---------- Carte ---------- */
const carte = L.map("carte", {zoomControl: true, attributionControl: true});
const fonds = {
  topo: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {maxZoom: 16,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, SRTM · style © <a href="https://opentopomap.org">OpenTopoMap</a>'}),
  sat: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 17,
    attribution: "Imagerie © Esri, Maxar, Earthstar Geographics"}),
};
fonds.topo.addTo(carte);
document.querySelectorAll("[data-fond]").forEach(b => b.onclick = () => {
  Object.values(fonds).forEach(f => carte.removeLayer(f));
  fonds[b.dataset.fond].addTo(carte).bringToBack();
  document.querySelectorAll("[data-fond]").forEach(x => x.setAttribute("aria-pressed", x === b));
});

const groupes = {};       // épisode -> L.featureGroup
const lignesParJour = {}; // "episode:jour" -> [polylines]
for (const f of V.traces) {
  const p = f.properties, c = couleur(p.episode);
  const latlngs = f.geometry.coordinates.map(x => [x[1], x[0]]);
  const transport = p.mode === "avion" || p.mode === "bus";
  const style = transport
    ? {color: c, weight: 2, opacity: .7, dashArray: "2 6"}
    : {color: c, weight: 3.5, opacity: .9, dashArray: p.trace_reel ? null : "8 6"};
  const ligne = L.polyline(latlngs, style);
  ligne.bindPopup(() => popupJour(p.episode, p.jour));
  ligne.on("click", () => choisirJour(p.episode, p.jour, false));
  (groupes[p.episode] ||= L.featureGroup()).addLayer(ligne);
  (lignesParJour[`${p.episode}:${p.jour}`] ||= []).push(ligne);
}
Object.values(groupes).forEach(g => g.addTo(carte));

// Lieux de nuit, cols et sommets
const marques = L.layerGroup().addTo(carte);
const lieuxAffiches = new Set();
for (const ep of V.episodes) for (const et of ep.etapes) for (const [, chemin] of et.troncons) for (const id of chemin) lieuxAffiches.add(id);
for (const id of lieuxAffiches) {
  const l = V.lieux[id]; if (!l) continue;
  const relief = l.col || l.sommet;
  const icone = relief
    ? L.divIcon({className: "", iconSize: [14, 12], html: `<svg width="14" height="12"><path d="M7 1 L13 11 H1 Z" fill="#29251f" stroke="#fff" stroke-width="1.5"/></svg>`})
    : L.divIcon({className: "", iconSize: [9, 9], html: `<svg width="9" height="9"><circle cx="4.5" cy="4.5" r="3.4" fill="#fff" stroke="#29251f" stroke-width="1.6"/></svg>`});
  const m = L.marker([l.lat, l.lon], {icon: icone, title: l.nom});
  m.bindTooltip(`${l.nom}${l.alt ? " · " + fmt(l.alt) + " m" : ""}`, {direction: "right", offset: [6, 0], className: "etiquette", permanent: !!relief});
  m.bindPopup(`<b>${l.nom}</b><br>${l.alt ? fmt(l.alt) + " m" : ""}${l.approx ? "<br><i>position approximative</i>" : ""}`);
  marques.addLayer(m);
}

/* ---------- Statistiques ---------- */
const marche = V.traces.filter(f => f.properties.mode === "marche");
const altMax = Math.max(...Object.values(V.lieux).map(l => l.alt || 0));
const joursMarche = new Set(marche.map(f => f.properties.episode + f.properties.jour)).size;
document.getElementById("chiffres").innerHTML = `
  <div><b>${fmt(marche.reduce((s, f) => s + f.properties.km, 0))} km</b><span>à pied</span></div>
  <div><b>${joursMarche}</b><span>jours de marche</span></div>
  <div><b>${fmt(altMax)} m</b><span>point culminant</span></div>`;

/* ---------- Épisodes et jours ---------- */
let episodeCourant = null, jourCourant = null;

function rendreEpisodes() {
  const zone = document.getElementById("episodes");
  zone.innerHTML = "";
  const tous = document.createElement("button");
  tous.className = "episode";
  tous.innerHTML = `<i style="background:conic-gradient(${["everest","dhaulagiri","annapurna","moto"].map((e,i)=>`${couleur(e)} ${i*25}% ${(i+1)*25}%`).join(",")})"></i><span><b>Tout le voyage</b><small>Du 7 octobre au 24 novembre 2011</small></span>`;
  tous.setAttribute("aria-pressed", episodeCourant === null);
  tous.onclick = () => choisirEpisode(null);
  zone.append(tous);
  for (const ep of V.episodes) {
    const b = document.createElement("button");
    b.className = "episode";
    const premiere = ep.etapes[0].date.replace(/[()]/g, ""), derniere = ep.etapes.at(-1).date.replace(/[()]/g, "");
    b.innerHTML = `<i style="background:${couleur(ep.id)}"></i><span><b>${ep.titre}</b><small>${ep.sous_titre} · ${premiere} → ${derniere}</small></span>`;
    b.setAttribute("aria-pressed", episodeCourant === ep.id);
    b.onclick = () => choisirEpisode(ep.id);
    zone.append(b);
  }
}

function statsJour(epId, jour) {
  const fs = V.traces.filter(f => f.properties.episode === epId && f.properties.jour === jour);
  return {
    km: fs.reduce((s, f) => s + f.properties.km, 0),
    dp: fs.filter(f => f.properties.mode === "marche").reduce((s, f) => s + f.properties.d_plus, 0),
    modes: [...new Set(fs.map(f => f.properties.mode))],
  };
}

function rendreJours() {
  const zone = document.getElementById("jours");
  zone.innerHTML = "";
  for (const ep of V.episodes.filter(e => episodeCourant === null || e.id === episodeCourant)) {
    const h = document.createElement("h2"); h.textContent = ep.titre; zone.append(h);
    for (const et of ep.etapes) {
      const s = statsJour(ep.id, et.jour), arrivee = V.lieux[et.troncons.at(-1)?.[1].at(-1)];
      const b = document.createElement("button");
      b.className = "jour"; b.style.setProperty("--c", couleur(ep.id));
      b.setAttribute("aria-current", episodeCourant === ep.id && jourCourant === et.jour);
      const detail = s.modes.includes("marche") ? `${fmt(s.km)} km<br>+${fmt(s.dp)} m`
                   : s.km ? `${fmt(s.km)} km<br>${s.modes.join(", ")}` : "repos";
      b.innerHTML = `<span class="n">J${et.jour}</span><span class="t">${et.titre}<small>${et.date.replace(/[()]/g, "")}${arrivee ? " · nuit à " + arrivee.nom : ""}</small></span><span class="d">${detail}</span>`;
      b.onclick = () => choisirJour(ep.id, et.jour, true);
      zone.append(b);
    }
  }
}

function popupJour(epId, jour) {
  const ep = V.episodes.find(e => e.id === epId), et = ep.etapes.find(e => e.jour === jour), s = statsJour(epId, jour);
  const chemin = et.troncons.flatMap(([, c], i) => i ? c.slice(1) : c).map(id => V.lieux[id]?.nom).filter(Boolean);
  return `<b>J${jour} · ${et.titre}</b><br>${et.date.replace(/[()]/g, "")} · ${chemin.join(" → ")}<br>${fmt(s.km)} km${s.dp ? ` · +${fmt(s.dp)} m` : ""}`;
}

function choisirEpisode(id) {
  episodeCourant = id; jourCourant = null;
  for (const [e, g] of Object.entries(groupes)) g.setStyle({opacity: id === null || e === id ? .9 : .18});
  const cible = id ? groupes[id] : L.featureGroup(Object.values(groupes));
  carte.flyToBounds(cible.getBounds(), {padding: [40, 40], duration: .8});
  rendreEpisodes(); rendreJours(); dessinerProfil();
}

function choisirJour(epId, jour, recadrer) {
  if (episodeCourant !== epId) { episodeCourant = epId; rendreEpisodes(); dessinerProfil(); }
  jourCourant = jour;
  for (const [e, g] of Object.entries(groupes)) g.setStyle({opacity: e === epId ? .35 : .12, weight: 3});
  const lignes = lignesParJour[`${epId}:${jour}`] || [];
  lignes.forEach(l => l.setStyle({opacity: 1, weight: 6}).bringToFront());
  if (recadrer && lignes.length) {
    carte.flyToBounds(L.featureGroup(lignes).getBounds(), {padding: [60, 60], maxZoom: 13, duration: .8});
    lignes[0].openPopup();
  }
  rendreJours(); surlignerJourProfil();
}

/* ---------- Profil d'altitude ---------- */
let profil = []; // {d, alt, lat, lon, jour}
const repere = L.circleMarker([0, 0], {radius: 7, color: "#fff", weight: 2, fillColor: "#29251f", fillOpacity: 1});

function dist(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function dessinerProfil() {
  const svg = document.getElementById("profil");
  const epId = episodeCourant || "dhaulagiri";
  const ep = V.episodes.find(e => e.id === epId);
  const fs = V.traces.filter(f => f.properties.episode === epId && f.properties.mode !== "avion");
  profil = []; let d = 0, prec = null;
  for (const f of fs) for (const c of f.geometry.coordinates) {
    if (prec) d += dist(prec, c);
    if (c[2] != null) profil.push({d, alt: c[2], lat: c[1], lon: c[0], jour: f.properties.jour});
    prec = c;
  }
  const c = couleur(epId);
  document.getElementById("profil-titre").innerHTML = `Profil d'altitude · <b>${ep.titre}</b>${episodeCourant ? "" : " (choisis un épisode)"}`;
  if (!profil.length) { svg.innerHTML = ""; return; }
  const dMax = profil.at(-1).d, aMin = Math.min(...profil.map(p => p.alt)), aMax = Math.max(...profil.map(p => p.alt));
  const bas = Math.floor((aMin - 200) / 1000) * 1000, haut = Math.ceil((aMax + 200) / 1000) * 1000;
  const X = v => v / dMax * 1000, Y = a => 132 - (a - bas) / (haut - bas) * 124;
  document.getElementById("profil-info").textContent = `${fmt(dMax)} km · de ${fmt(aMin)} à ${fmt(aMax)} m`;
  const pas = Math.max(1, Math.floor(profil.length / 900));
  const pts = profil.filter((_, i) => i % pas === 0).map(p => `${X(p.d).toFixed(1)},${Y(p.alt).toFixed(1)}`);
  let grille = "";
  for (let a = bas; a <= haut; a += 1000) grille += `<line x1="0" x2="1000" y1="${Y(a)}" y2="${Y(a)}" stroke="currentColor" stroke-opacity=".12" vector-effect="non-scaling-stroke"/><text x="4" y="${Y(a) - 3}" font-size="10" fill="currentColor" opacity=".5">${fmt(a)} m</text>`;
  let separ = "", prevJour = profil[0].jour;
  for (const p of profil) if (p.jour !== prevJour) { separ += `<line x1="${X(p.d)}" x2="${X(p.d)}" y1="0" y2="132" stroke="currentColor" stroke-opacity=".15" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>`; prevJour = p.jour; }
  svg.style.color = css("encre");
  svg.innerHTML = `${grille}${separ}
    <rect id="jour-surligne" y="0" height="132" fill="${c}" fill-opacity=".12" width="0"/>
    <polygon points="0,132 ${pts.join(" ")} 1000,132" fill="${c}" fill-opacity=".22"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line id="curseur" y1="0" y2="132" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>`;
  surlignerJourProfil();
}

function surlignerJourProfil() {
  const r = document.getElementById("jour-surligne"); if (!r || !profil.length) return;
  const pts = profil.filter(p => p.jour === jourCourant);
  if (!pts.length) { r.setAttribute("width", 0); return; }
  const dMax = profil.at(-1).d;
  r.setAttribute("x", pts[0].d / dMax * 1000);
  r.setAttribute("width", (pts.at(-1).d - pts[0].d) / dMax * 1000);
}

const svgProfil = document.getElementById("profil"), bulle = document.getElementById("infobulle");
svgProfil.addEventListener("mousemove", e => {
  if (!profil.length) return;
  const box = svgProfil.getBoundingClientRect(), x = (e.clientX - box.left) / box.width;
  const d = x * profil.at(-1).d;
  let lo = 0, hi = profil.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; profil[m].d < d ? lo = m + 1 : hi = m; }
  const p = profil[lo];
  repere.setLatLng([p.lat, p.lon]).addTo(carte);
  const cur = document.getElementById("curseur");
  cur.setAttribute("x1", x * 1000); cur.setAttribute("x2", x * 1000); cur.setAttribute("visibility", "visible");
  bulle.style.display = "block";
  bulle.style.left = (e.clientX - box.left + 16) + "px"; bulle.style.top = (box.top - svgProfil.parentElement.getBoundingClientRect().top + 10) + "px";
  bulle.textContent = `J${p.jour} · ${fmt(p.alt)} m · km ${fmt(p.d)}`;
});
svgProfil.addEventListener("mouseleave", () => {
  carte.removeLayer(repere); bulle.style.display = "none";
  document.getElementById("curseur")?.setAttribute("visibility", "hidden");
});
svgProfil.addEventListener("click", e => {
  if (!profil.length) return;
  const box = svgProfil.getBoundingClientRect(), d = (e.clientX - box.left) / box.width * profil.at(-1).d;
  const p = profil.find(q => q.d >= d) || profil.at(-1);
  choisirJour(episodeCourant || "dhaulagiri", p.jour, true);
});

carte.fitBounds(L.featureGroup(Object.values(groupes)).getBounds(), {padding: [30, 30]});
rendreEpisodes(); rendreJours(); dessinerProfil();
</script>
</body>
</html>
